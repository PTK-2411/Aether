[package]
name = "rust_browser"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "blocking", "gzip", "brotli", "deflate"] }
url = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde_json = "1.0"
